name: C Shell CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        compiler:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Display operating system information
        run: |
          echo "=== Operating System Information ==="
          uname -a
          cat /etc/os-release

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Display compiler information
        run: |
          ${{ matrix.compiler }} --version
          make --version

      - name: Clean previous build artifacts
        run: make clean

      - name: Build shell
        run: make CC=${{ matrix.compiler }}

      - name: Run complete test suite
        run: make CC=${{ matrix.compiler }} test

name: C Shell CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        compiler:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Display operating system information
        run: |
          echo "=== Operating System Information ==="
          uname -a
          cat /etc/os-release

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Display compiler information
        run: |
          ${{ matrix.compiler }} --version
          make --version

      - name: Clean previous build artifacts
        run: make clean

      - name: Build shell
        run: make CC=${{ matrix.compiler }}

      - name: Run complete test suite
        run: make CC=${{ matrix.compiler }} test

  static-analysis:
    name: Cppcheck Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Display Cppcheck version
        run: cppcheck --version

      - name: Create reports directory
        run: mkdir -p reports

      - name: Generate XML analysis report
        continue-on-error: true
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --xml \
            --xml-version=2 \
            -I src \
            src \
            2> reports/cppcheck-report.xml

      - name: Generate readable analysis report
        continue-on-error: true
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --template=gcc \
            -I src \
            src \
            > reports/cppcheck-report.txt 2>&1

      - name: Upload Cppcheck reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-static-analysis-report
          path: reports/
          if-no-files-found: error
          retention-days: 14

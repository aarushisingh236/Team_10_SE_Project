name: C Shell CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Display POSIX environment information (TC-PORT-01)
        run: |
          echo "=== Operating System Information ==="
          uname -a
          cat /etc/os-release
          echo "=== Compiler and Toolchain Information ==="
          gcc --version
          make --version

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build shell
        run: make

      - name: Run tests
        run: make test
